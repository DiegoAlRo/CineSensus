<!-- Parte superior de la página. -->
<div class="admin-header">

    <!-- Título de la página. -->
    <h1>RESEÑAS</h1>

    <!-- Filtro de la película. -->
    <div class="filtros-header">

        <div class="filtros-inputs">
            <input type="text" placeholder="Buscar email..." [(ngModel)]="filtroEmail" (input)="aplicarFiltros()">

            <input type="text" placeholder="Buscar película..." [(ngModel)]="filtroPelicula" (input)="aplicarFiltros()">
        </div>
    </div>
</div>

<!-- Tabla de las reseñas. -->
<div class="tabla-wrapper">
    <table class="admin-table">
        <thead>

            <!-- Enunciados de las columnas. -->
            <tr>
                <th>USUARIO</th>
                <th>PELÍCULA</th>
                <th>PUNTUACIÓN</th>
                <th>COMENTARIO</th>
                <th>FECHA</th>
                <th>ACCIONES</th>
            </tr>
        </thead>

        <tbody>

            <!-- Contenidos de tablas. -->
            <tr *ngFor="let r of resenasPaginadas">
                <td>{{ r.usuario.email }}</td>
                <td>{{ r.pelicula.titulo }}</td>
                <td>{{ r.puntuacion }}</td>
                <td>{{ r.comentario }}</td>
                <td>{{ r.fecha | date:'yyyy-MM-dd' }}</td>

                <td>

                    <!-- Botón para borrar la reseña. -->
                    <button class="btn-borrar" (click)="eliminarResena(r.id)">🗑️</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Botones de paginación. -->
<div class="paginacion">
    <button (click)="paginaAnterior()" [disabled]="paginaActual === 1">
        ◀ Anterior
    </button>

    <span>Página {{ paginaActual }} de {{ totalPaginas }}</span>

    <button (click)="paginaSiguiente()" [disabled]="paginaActual === totalPaginas">
        Siguiente ▶
    </button>
</div>
