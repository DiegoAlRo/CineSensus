<div class="admin-header">
  <h1>PELÍCULAS</h1>

  <div class="filtros-header">

    <div class="filtros-inputs">
      <input type="text" placeholder="Buscar por título..." [(ngModel)]="filtroTexto" (input)="aplicarFiltros()">
    </div>
  </div>

  <button class="btn-crear" (click)="crearPelicula()">+ Crear</button>
</div>

<div class="tabla-wrapper">
  <table class="admin-table">
    <thead>
      <tr>
        <th>POSTER</th>
        <th>TÍTULO</th>
        <th>GÉNERO</th>
        <th>DURACIÓN</th>
        <th>RESTRICCIÓN</th>
        <th>ACCIONES</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let p of peliculasPaginadas">
        <td><img [src]="p.poster" class="poster"></td>
        <td>{{ p.titulo }}</td>
        <td>{{ p.genero }}</td>
        <td>{{ p.duracion }} min</td>
        <td>+{{ p.restriccionEdad }}</td>
        <td>
          <button class="btn-editar" (click)="editarPelicula(p.id)">✏️</button>
          <button class="btn-borrar" (click)="eliminarPelicula(p.id)">🗑️</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>


<div class="paginacion">
  <button (click)="paginaActual = paginaActual - 1" [disabled]="paginaActual === 1">
    ◀ Anterior
  </button>

  <span>Página {{ paginaActual }} de {{ totalPaginas }}</span>

  <button (click)="paginaActual = paginaActual + 1" [disabled]="paginaActual === totalPaginas">
    Siguiente ▶
  </button>
</div>
